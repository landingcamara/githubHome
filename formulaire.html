<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo test</title>
   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
     integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous" >
    <!--<link href="assets/css/bootstrap.min.css" rel="stylesheet"/> -->
  </head>
  <body>
    <section class="test py-5">
        <div class="container">
            <form >
                <div class="row">
                    <div class="col">
                        <div class="mb-3">
                            <label for="1" class="form-label">Name</label>
                            <input type="text"
                            class="form-control"
                            id="1"
                            placeholder="Prenom Nom"/>
                        </div>
                        <div class="mb-3">
                            <label for="2" class="form-label">Email Adresse</label>
                            <input type="email"
                            class="form-control"
                            id="2"
                            placeholder="name@example.com"/>
                        </div>
                        <div class="mb-3">
                            <label for="3" class="form-label">Password</label>
                            <input type="password"
                            class="form-control"
                            id="3"
                            placeholder="Mot de passe"/>
                        </div>
                        <div class="mb-3">
                            <label for="formFile" class="form-label">Default file in input example</label>
                            <input type="file" class="form-control" id="formFile" >
                        </div>
                        <div class="mb-3">
                            <label for="exampleFormControlTextarea" class="form-label">Message example</label>
                            <textarea id="exampleFormControlTextarea" class="form-control"></textarea>
                        </div>
                    </div>
                    <div class="col">
                        <div class="md-3">
                            <label for="select" class="form-label">Faites votre choix</label>
                            <select class="form-select" area-label="Default select">
                                <option selected="Open this select"></option>
                                <option value="1">One</option>
                                <option value="2">Two</option>
                                <option value="3">Tree</option>
                            </select>
                        </div>
                        <div class="md3">
                            <div class="form-check">
                                <input type="checkbox" value="" id="flexCheckDefault" class="form-check-input">
                                <label for="flexCheckDefault" class="form-check-label">
                                    Default checkbox
                                </label>
                            </div>
                            <div class="form-check">
                                <input type="checkbox" value="" id="flexCheckDefault" class="form-check-input">
                                <label for="flexCheckDefault" class="form-check-label">
                                    checked checkbox
                                </label>
                            </div>
                        </div>
                        <div class="md-3">
                            <div class="form-check">
                                <input type="radio" name="flexRadioDefault" id="flexRadioDefault1" class="form-check-input">
                                <label for="flexRadioDefault1" class="form-check-label" checked>
                                    Default radio
                                </label>
                            </div>
                            <div class="form-check">
                                <input type="radio" name="flexRadioDefault" id="flexRadioDefault2" class="form-check-input">
                                <label for="flexRadioDefault2" class="form-check-label">
                                    Default checked radio
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="col">
                        <div class="input-group mb-3">
                            <span class="input-group-text" id="basic-addon1"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" placeholder="Mot de passe" aria-label="password" aria-describedby="basic-addon1">
                            </div>

                            <div class="input-group mb-3">
                            <input type="text" class="form-control" placeholder="Recipient’s username" aria-label="Recipient’s username" aria-describedby="basic-addon2">
                            <span class="input-group-text" id="basic-addon2">@example.com</span>
                            </div>

                            <div class="mb-3">
                            <label for="basic-url" class="form-label">Your vanity URL</label>
                            <div class="input-group">
                                <span class="input-group-text" id="basic-addon3">https://example.com/users/</span>
                                <input type="text" class="form-control" id="basic-url" aria-describedby="basic-addon3 basic-addon4">
                            </div>
                            <div class="form-text" id="basic-addon4">Example help text goes outside the input group.</div>
                            </div>

                            <div class="input-group mb-3">
                            <span class="input-group-text">$</span>
                            <input type="text" class="form-control" aria-label="Amount (to the nearest dollar)">
                            <span class="input-group-text">.00</span>
                            </div>

                            <div class="input-group mb-3">
                            <input type="text" class="form-control" placeholder="Username" aria-label="Username">
                            <span class="input-group-text">@</span>
                            <input type="text" class="form-control" placeholder="Server" aria-label="Server">
                            </div>

                            <div class="input-group">
                            <span class="input-group-text">With textarea</span>
                            <textarea class="form-control" aria-label="With textarea"></textarea>
                            </div>
                    </div>
                </div>

            </form>
        </div>
    </section>
    <!--<script src="assets/js/bootstrap.bundle.min.js"></script> lien serveur=>-->
    <script src=" https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist"
     integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQQqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous" ></script>
  </body>
</html>
